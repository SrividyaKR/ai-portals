<!doctype html><meta charset="utf-8"><title>Portals tour (9:16)</title>
<style>html,body{margin:0;height:100%;background:#111;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#ddd}
#box{height:96vh;aspect-ratio:9/16;position:relative;background:#000;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#go{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;padding:16px 30px;border-radius:40px;border:1px solid #888;background:#222;color:#fff;cursor:pointer}
#note{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:13px;color:#999;padding:0 18px}
#load{position:absolute;left:10%;right:10%;bottom:12%;text-align:center;font-size:15px;color:#fff;z-index:5;pointer-events:none;text-shadow:0 1px 3px #000}
#bar{height:4px;background:#333;border-radius:2px;margin:10px 0}#bar i{display:block;height:100%;width:0;background:#9bd;border-radius:2px;transition:width .5s}
#ls{font-size:13px;color:#aaa}</style>
<div id="box"><button id="go">&#9654; Play the tour</button><div id="note">Twelve worlds, about 4 minutes. The first load takes about 30 seconds on a black screen.</div></div>
<script>
const q = new URLSearchParams(location.search), box = document.getElementById('box'), go = document.getElementById('go');
const tour = q.get('tour') || 'dragon-blood-forest,salt-hexagons,dye-vats-of-fez,ice-bubble-lake,fish-rain-night,bone-breaker-ridge,monarch-river,infinity-mirror-room,snow-monsters-watch,long-table-village,living-root-bridge,firefly-synchrony';
go.onclick = () => {
  const f = document.createElement('iframe'); f.allow = 'autoplay'; f.src = '/?tour=' + tour + '&end=1&seed=' + (q.get('seed') || '7'); box.appendChild(f);
  go.remove(); document.getElementById('note').remove();
  const L = document.createElement('div'); L.id = 'load'; L.innerHTML = '<div>Loading the first world. Please wait, it is working.</div><div id="bar"><i></i></div><div id="ls">0 s</div>'; box.appendChild(L);
  const t0 = Date.now(), iv = setInterval(() => {
    const s = Math.round((Date.now() - t0) / 1000); document.getElementById('ls').textContent = s + ' s (about 30 s the first time)'; L.querySelector('i').style.width = Math.min(95, s * 3) + '%';
    try { const e = f.contentWindow.__engine; if (e && e.cur && s > 3) { L.remove(); clearInterval(iv); } } catch (x) { /* not ready yet */ }
  }, 500);
};
if (q.get('auto')) go.click();
</script>
